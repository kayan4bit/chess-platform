# Render blueprint — single Docker web service.
# Data lives in a persistent disk so the SQLite file survives every redeploy +
# restart. JWT_SECRET is generated once and pinned forever via generateValue.
# Note: persistent disks require Render's Starter plan or higher.

services:
  - type: web
    name: chess-backend
    runtime: docker
    plan: starter # disks are not available on the free plan
    region: oregon
    rootDir: .
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: chess-data
      mountPath: /app/apps/backend/prisma/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true # persisted by Render across restarts
      - key: DATABASE_URL
        value: file:./data/chess.db
      - key: STOCKFISH_PATH
        value: /usr/games/stockfish
      - key: BOT_FALLBACK_MS
        value: "15000"
      - key: BOT_FALLBACK_LEVEL
        value: "6"
      - key: CORS_ORIGIN
        sync: false # set this manually to your frontend origin (e.g. https://chess-frontend.pages.dev)
